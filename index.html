<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Bishenpur-1994</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div id="playArea" class="play-area">
        <video id="schoolVideo" autoplay loop muted playsinline>
            <source src="school-gate.mp4" type="video/mp4">
            Your browser does not support the video tag.
        </video>

        <div class="media-overlay-pill">
            <div class="track-info">
                <div class="track-thumb">
                    <video class="mini-thumb-video" autoplay loop muted playsinline>
                        <source src="school-gate.mp4" type="video/mp4">
                    </video>
                </div>
                <div class="track-text">
                    <span class="track-title">Bishenpur Memories</span>
                    <span class="track-sub">Class of '94 Official Track</span>
                </div>
            </div>
            
            <div class="pill-controls">
                <span id="timeDisplay">0:00 / 0:00</span>
                <button class="pill-play-btn" id="playBtn" onclick="togglePlay()">
                    <span id="playIcon">▶</span>
                </button>
            </div>

            <audio id="audio1" src="song1.mp3" preload="auto"></audio>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
